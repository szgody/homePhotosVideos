# Home Photos & Videos - 照片视频管理系统
version: '3'

services:
  # 后端服务 Backend service
  backend:
    image: godys/home-photos:backend-latest
    ports:
      - "3001:3000"
    volumes:
      - ./data:/app/data
      - ./public:/app/public
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_DIR=/app/data
      - PUBLIC_DIR=/app/public
      - BASE_URL=
      - PHOTOS_PATH=/photos
      - PHOTO_THUMBNAILS_PATH=/photo_thumbnails
      - VIDEOS_PATH=/videos
      - VIDEO_THUMBNAILS_PATH=/video_thumbnails
      - ALLOWED_ORIGINS=http://your-server-ip:8080,http://localhost:8080
    networks:
      - app-network
    restart: unless-stopped

  # 前端服务(Nginx) Frontend service (Nginx)
  nginx:
    image: godys/home-photos:frontend-latest
    ports:
      - "8080:80"
    networks:
      - app-network
    depends_on:
      - backend
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
